<style>
/* Layout: one iPhone frame on a red-and-cream checkered ground; cream app screens, red brand, charcoal type, UM orange/green only as small accents. Same tokens as the website. */
:root{
  --cream:#F7F0E3; --tan:#E9D6B4; --tan-dk:#C9A877; --paper:#FFFCF6;
  --red:#C8261C; --red-dk:#9B1B13; --char:#24211E; --muted:#6B6155; --line:#E2D2B6;
  --orange:#F47321; --green:#005030; --green-dk:#003B24;
  --f-display:"Archivo","Arial Narrow",Impact,sans-serif;
  --f:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--char);font-family:var(--f);background:var(--tan);background-image:repeating-conic-gradient(rgba(200,38,28,.16) 0 25%,transparent 0 50%);background-size:56px 56px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.caption{background:var(--paper);color:var(--char);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.caption b{color:var(--green)}
/* iPhone 17 Pro Max: 440x956pt screen, thin black border, aluminum frame, Dynamic Island, Action button, Camera Control */
.device{--m1:#F7A764;--m2:#E5651E;--m3:#A9440B;position:relative;width:min(464px,100%,calc((100vh - 130px) * 464 / 980));aspect-ratio:464/980;flex:none}
.device[data-c="blue"]{--m1:#6E82A3;--m2:#34445F;--m3:#1B2638}
.device[data-c="silver"]{--m1:#FAFAFA;--m2:#CFD0D2;--m3:#8E9093}
.phone{position:absolute;inset:0;border-radius:74px;padding:3px;background:linear-gradient(140deg,var(--m1),var(--m2) 42%,var(--m3) 78%,var(--m2));box-shadow:0 0 0 1px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.35),0 40px 80px rgba(36,33,30,.38)}
.bezel{width:100%;height:100%;background:#050505;border-radius:71px;padding:9px}
.screen{width:100%;height:100%;background:var(--cream);border-radius:62px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.hw{position:absolute;width:5px;background:linear-gradient(90deg,var(--m3),var(--m1) 60%,var(--m2));z-index:-1}
.hw.l{left:-4px;border-radius:3px 0 0 3px}
.hw.r{right:-4px;border-radius:0 3px 3px 0;background:linear-gradient(270deg,var(--m3),var(--m1) 60%,var(--m2))}
.hw.action{top:17%;height:5.2%}
.hw.volup{top:25.5%;height:8.6%}
.hw.voldn{top:36%;height:8.6%}
.hw.side{top:27%;height:12.5%}
.hw.cam{top:56%;height:8.5%;width:3px;right:-2px;background:linear-gradient(270deg,#1b1b1d,#3a3a3e);box-shadow:0 0 0 1px var(--m2)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:30}
.island::after{content:"";position:absolute;right:13px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2c3550,#0a0c14 65%)}
.status{height:56px;flex:none;display:grid;grid-template-columns:1fr 124px 1fr;align-items:center;padding:4px 10px 0;background:var(--paper);font-family:-apple-system,"SF Pro Text",var(--f)}
.status .time{justify-self:center;font-weight:600;font-size:17px;letter-spacing:-.02em}
.status .icons{justify-self:center;display:flex;gap:6px;align-items:center}
.status .bat{width:26px;height:12.5px;border:1.5px solid rgba(36,33,30,.45);border-radius:4px;position:relative;display:inline-block}
.status .bat::before{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 2px 2px 0;background:rgba(36,33,30,.45)}
.status .bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:var(--char);border-radius:1.5px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#111;z-index:35;pointer-events:none}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.swatches span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--char);background:var(--paper);padding:6px 10px;border-radius:99px}
.swatches button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;background:var(--paper);border-radius:99px;padding:5px 11px 5px 6px;font:700 12px var(--f);cursor:pointer;color:var(--char)}
.swatches button i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatches button[aria-pressed="true"]{border-color:var(--char)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,252,246,.78);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 26px rgba(36,33,30,.16),inset 0 1px 0 rgba(255,255,255,.9);border-radius:34px;margin:2px 14px 30px;padding:6px 4px}
.tab{border:0;background:none;font:700 10px var(--f);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;padding:4px 0}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--red);background:rgba(200,38,28,.1);border-radius:26px}
.tab .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--orange);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.d{font-family:var(--f-display);font-stretch:72%;font-weight:900;text-transform:uppercase;line-height:.9;margin:0;text-wrap:balance}
.kick{font:800 10.5px var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.kick::before{content:"";width:14px;height:3px;background:linear-gradient(90deg,var(--orange) 50%,var(--green) 50%)}
.pad{padding:0 18px}
.sec{padding:22px 18px 8px}
.sec .d{font-size:28px}
.btn{border:0;background:var(--red);color:#fff;font:800 15px var(--f);padding:14px 18px;border-radius:99px;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.btn:active{background:var(--red-dk)}
.btn.full{width:100%}
.btn.out{background:transparent;color:var(--char);box-shadow:inset 0 0 0 2px var(--char)}
.btn.cream{background:var(--cream);color:var(--red)}
.btn.sm{padding:9px 14px;font-size:13px}
.price{font-variant-numeric:tabular-nums;font-weight:800}
.ph{display:inline-block;background:#FFF1D6;border:1px dashed var(--tan-dk);color:#7A5A22;font-size:.85em;font-weight:600;padding:0 6px;border-radius:5px}
.tag{display:inline-block;font:800 9.5px var(--f);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--char);color:var(--cream)}
.tag.o{background:var(--orange);color:#fff}
.tag.g{background:var(--green);color:#fff}
.back{border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 12px;background:var(--paper)}
.sbar{background:var(--green);color:#fff;text-align:center;font-family:var(--f-display);font-stretch:72%;font-weight:900;text-transform:uppercase;font-size:15px;letter-spacing:.05em;padding:6px 0;border-bottom:3px solid var(--orange)}
.sbar i{color:var(--orange);font-style:normal;margin:0 8px}
.logo{display:flex;align-items:center;gap:8px}
.logo .lmark{width:40px;height:40px}
.wm{line-height:1}

.wm b{display:inline-block;background:var(--red);color:var(--cream);font:700 12px var(--f);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,252,246,.7);white-space:nowrap}
.wm small{display:block;font:800 8.5px var(--f);letter-spacing:.24em;color:var(--green);margin-top:4px;text-transform:uppercase}
.applogo{margin:0 18px 12px;width:calc(100% - 36px)}

/* hero */
.hero{background:var(--tan);padding:18px 18px 22px;position:relative;overflow:hidden}
.hero .d{font-size:38px;max-width:62%;position:relative}
.hero .d em{font-style:normal;color:var(--red)}
.hero p{margin:8px 0 0;font-weight:600;font-size:15px;max-width:20ch;position:relative}
.hero .pz{position:absolute;right:-64px;top:34px;width:176px}
.hero .hrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:16px;position:relative}
.hero .hrow .btn{padding:11px 6px;font-size:12.5px}
.adv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px 0}
.adv div{background:var(--paper);border-bottom:3px solid var(--orange);border-radius:14px;padding:10px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25}
.adv svg{width:28px;height:28px;display:block;margin:0 auto 4px}

.express{margin:16px 18px 0;background:var(--red);color:#fff;border-radius:20px;padding:16px}
.express .d{font-size:24px}
.express p{margin:6px 0 12px;font-size:13px;color:#FBE3DA}
.xl{display:grid;gap:8px}
.xi{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--char);border-radius:14px;padding:7px 8px}
.xi .xa{width:52px;height:52px;border-radius:10px;background:var(--tan);display:grid;place-items:center}
.xi .xa svg{width:42px}
.xi b{display:block;font-size:13.5px;line-height:1.2}
.xi small{color:var(--muted);font-size:12px}
.add{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:22px;font-weight:700;line-height:1;cursor:pointer}

.hs{display:flex;gap:10px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.dc{flex:none;width:200px;background:var(--paper);border-radius:18px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;cursor:pointer}
.dc .da{background:var(--tan);height:110px;display:grid;place-items:center;position:relative}
.dc .da svg{width:100px}
.dc .da .tag{position:absolute;top:8px;left:8px}
.dc .db{padding:10px 12px 12px}
.dc b{display:block;font-size:14px}
.dc .price{color:var(--red);font-size:16px}

/* menu */
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none;background:var(--paper)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer}
.cats button.on{background:var(--char);color:var(--cream);border-color:var(--char)}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;background:var(--paper);margin:0 18px 10px;padding:9px;border-radius:16px;border:1px solid var(--line)}
.row .ra{width:76px;height:76px;border-radius:12px;background:var(--tan);display:grid;place-items:center}
.row .ra svg{width:62px}
.row b{font-size:14.5px}
.row p{margin:2px 0 3px;font-size:12px;color:var(--muted);line-height:1.35}
.byo{margin:4px 18px 14px;background:var(--green);color:var(--cream);border-radius:18px;padding:14px;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:0;text-align:left;cursor:pointer;width:calc(100% - 36px)}
.byo svg{width:70px}

.bprev svg{width:200px}
.bprev .bp{position:absolute;right:18px;bottom:14px;color:var(--cream);text-align:right}
.bprev .bp small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#CFC5B6}

.bl{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px;background:var(--paper)}

.tops{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qty{display:inline-flex;align-items:center;gap:12px;background:var(--paper);border-radius:99px;padding:4px;border:1px solid var(--line)}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--cream);font-size:19px;font-weight:700;cursor:pointer}
.qty b{min-width:22px;text-align:center}
.sticky{position:sticky;bottom:0;padding:12px 18px 14px;background:linear-gradient(transparent,var(--cream) 30%)}

/* order */
.box{background:var(--paper);border-radius:16px;padding:4px 14px;margin:0 18px;border:1px solid var(--line)}
.line{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line small{display:block;color:var(--muted);font-size:11.5px}
.line .ctrl{display:flex;gap:8px;align-items:center;margin-top:6px}
.line .ctrl button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;font-size:14px}
.line .ctrl .rm{width:auto;border:0;color:var(--red);font-size:12px;font-weight:700}
.slots{display:flex;gap:6px;overflow-x:auto;padding:0 18px 2px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slots button{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
.slots button.on{border-color:var(--green);background:#E3EFE8;color:var(--green)}
.pick{display:grid;gap:6px;padding:0 18px}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums}
.tot.big{font-size:18px;font-weight:800;border-top:2px solid var(--char);margin-top:6px;padding-top:9px}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:15px var(--f);background:var(--paper);color:var(--char)}
.field:focus{border-color:var(--red);outline:none}
.lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.notice{background:#FFF1D6;border:1px dashed var(--tan-dk);border-radius:12px;padding:10px 12px;font-size:12.5px;color:#5E4518;margin:12px 18px 0}
.conf{margin:14px 18px;background:var(--paper);border-radius:20px;padding:20px;text-align:center;border:1px solid var(--line)}
.conf .code{font-family:var(--f-display);font-stretch:72%;font-weight:900;font-size:52px;color:var(--red);line-height:1;margin:6px 0}
.track{text-align:left;margin-top:14px;display:grid;gap:10px}
.st{display:flex;gap:10px;align-items:center;font-size:13.5px}
.st i{width:26px;height:26px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:var(--muted);flex:none}
.st.done i{background:var(--green);color:#fff}
.st.now i{background:var(--red);color:#fff}

/* rewards */
.rhero{background:var(--green);border-bottom:4px solid var(--orange);color:var(--cream);padding:18px 18px 22px}
.rhero .d{font-size:36px}
.rhero h3{font-family:var(--f-display);font-stretch:72%;font-weight:900;text-transform:uppercase;font-size:24px;color:var(--orange);margin:8px 0 0;line-height:.95}
.punch{margin:-12px 18px 0;background:var(--paper);border-radius:20px;padding:16px;border:2.5px dashed var(--red);position:relative}

.hole{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--cream);font-weight:800;font-size:12px;color:var(--tan-dk)}
.hole.on{background:var(--red);border-color:var(--red)}

.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:12px 14px;margin:0 18px 8px;border:1px solid var(--line)}

.ritem b{font-size:14px}
.mcode{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.18em;background:var(--char);color:var(--cream);border-radius:12px;padding:12px;text-align:center}
.bars{height:40px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--char) 0 2px,transparent 2px 5px,var(--char) 5px 6px,transparent 6px 9px,var(--char) 9px 12px,transparent 12px 14px)}

/* campus */
.map{margin:0 18px;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;background:#EFE3CB}

.mapinfo{margin:8px 18px 0;background:var(--paper);border-radius:12px;padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.pin{cursor:pointer}
.card2{margin:0 18px 10px;background:var(--paper);border-radius:16px;padding:14px;border:1px solid var(--line)}

.pkg{display:flex;justify-content:space-between;align-items:center;gap:10px}

.pil{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin:0 18px 8px;background:var(--paper);border-radius:14px;padding:10px;border:1px solid var(--line)}
.pil svg{width:64px;height:48px;background:var(--cream);border-radius:10px}
.pil b{font-size:14px}
.pil p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.toast{position:absolute;left:18px;right:18px;bottom:112px;background:var(--char);color:#fff;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:40;transition:opacity .25s,transform .25s;opacity:0;transform:translateY(10px);pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

<script>
// ---- Shared pizza illustrations (generated SVG, seeded so they look the same every load) ----
let PZN=0;
const PC={crust:'#D39A4C',crustDk:'#B57A33',sauce:'#C8321F',cheese:'#F4C55E',cheeseLt:'#FBE0A0',brown:'#DE963A',vodka:'#E9895C',pep:'#B3271D',pepDk:'#86190F',basil:'#2E7A3C',honey:'#E9A93A',saus:'#7E4426',mush:'#D8C3A2',pepper:'#3D8A3A',onion:'#C7A0C4',olive:'#2A2522'};
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1=n=>Math.round(n*10)/10;
function drawTops(r,tops,pts,m){
  let s='';
  for(let i=0;i<Math.round(9*m);i++){const[x,y]=pts();s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(6+r()*10)}" ry="${f1(4+r()*6)}" fill="${PC.cheeseLt}" opacity=".7" transform="rotate(${Math.round(r()*180)} ${f1(x)} ${f1(y)})"/>`}
  for(let i=0;i<Math.round(14*m);i++){const[x,y]=pts();s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1.6+r()*3.6)}" fill="${PC.brown}" opacity="${f1(.35+r()*.35)}"/>`}
  const cnt=k=>Math.round(k*m);
  tops.forEach(t=>{
    if(t==='xcheese')for(let i=0;i<cnt(8);i++){const[x,y]=pts();s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(6+r()*5)}" fill="#FFF0C4" opacity=".75"/>`}
    if(t==='sauce')for(let i=0;i<cnt(5);i++){const[x,y]=pts();s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="10" ry="6.5" fill="${PC.sauce}" opacity=".9" transform="rotate(${Math.round(r()*180)} ${f1(x)} ${f1(y)})"/>`}
    if(t==='saus')for(let i=0;i<cnt(10);i++){const[x,y]=pts();s+=`<path d="M${f1(x-4)} ${f1(y)} q2 -5 6 -3 q4 2 2 6 q-3 4 -7 1z" fill="${PC.saus}"/>`}
    if(t==='mush')for(let i=0;i<cnt(7);i++){const[x,y]=pts();s+=`<g transform="rotate(${Math.round(r()*360)} ${f1(x)} ${f1(y)})"><path d="M${f1(x-7)} ${f1(y)} a7 6 0 0 1 14 0z" fill="${PC.mush}"/><rect x="${f1(x-2)}" y="${f1(y)}" width="4" height="6" rx="1" fill="${PC.mush}"/></g>`}
    if(t==='pepper')for(let i=0;i<cnt(7);i++){const[x,y]=pts();s+=`<path d="M${f1(x-7)} ${f1(y)} a7 7 0 0 1 14 0" fill="none" stroke="${PC.pepper}" stroke-width="3" stroke-linecap="round" transform="rotate(${Math.round(r()*360)} ${f1(x)} ${f1(y)})"/>`}
    if(t==='onion')for(let i=0;i<cnt(7);i++){const[x,y]=pts();s+=`<path d="M${f1(x-8)} ${f1(y)} a8 8 0 0 1 16 0" fill="none" stroke="${PC.onion}" stroke-width="2" stroke-linecap="round" transform="rotate(${Math.round(r()*360)} ${f1(x)} ${f1(y)})"/>`}
    if(t==='olive')for(let i=0;i<cnt(8);i++){const[x,y]=pts();s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="4" fill="none" stroke="${PC.olive}" stroke-width="2.6"/>`}
    if(t==='pep')for(let i=0;i<cnt(9);i++){const[x,y]=pts();const rr=8+r()*3;s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(rr)}" fill="${PC.pep}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(rr-2.5)}" fill="none" stroke="${PC.pepDk}" stroke-width="1.5" opacity=".6"/><circle cx="${f1(x-rr/3)}" cy="${f1(y-rr/3)}" r="${f1(rr/4)}" fill="#fff" opacity=".2"/>`}
    if(t==='basil')for(let i=0;i<cnt(5);i++){const[x,y]=pts();s+=`<path d="M${f1(x-9)} ${f1(y)} Q${f1(x)} ${f1(y-9)} ${f1(x+9)} ${f1(y)} Q${f1(x)} ${f1(y+9)} ${f1(x-9)} ${f1(y)}Z" fill="${PC.basil}" transform="rotate(${Math.round(r()*180)} ${f1(x)} ${f1(y)})"/>`}
    if(t==='honey')for(let i=0;i<cnt(3);i++){const[x,y]=pts();s+=`<path d="M${f1(x-22)} ${f1(y)} q5.5 -6 11 0 t11 0 t11 0 t11 0" fill="none" stroke="${PC.honey}" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>`}
  });
  return s;
}
// spec: {shape:'slice'|'pie'|'square'|'cup'|'combo'|'bottle', base:'cheese'|'vodka', tops:[]}
function art(spec,seed=''){
  const id='pz'+(++PZN),r=rng(hashStr(JSON.stringify(spec)+seed)),base=spec.base==='vodka'?PC.vodka:PC.cheese,tops=spec.tops||[];
  const svg=b=>`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${b}</svg>`;
  if(spec.shape==='slice'){
    const tri='M100 16 L26 166 Q100 194 174 166 Z';
    const pts=()=>{const y=46+r()*114,hw=(y-16)/150*74*.72;return[100+(r()*2-1)*hw,y]};
    return svg(`<defs><clipPath id="${id}"><path d="M100 24 L34 160 Q100 184 166 160 Z"/></clipPath></defs><ellipse cx="100" cy="186" rx="70" ry="6" fill="#000" opacity=".12"/><path d="${tri}" fill="${PC.sauce}"/><g clip-path="url(#${id})"><path d="M100 24 L34 160 Q100 184 166 160 Z" fill="${base}"/>${drawTops(r,tops,pts,1)}</g><path d="M28 166 Q100 192 172 166" fill="none" stroke="${PC.crust}" stroke-width="18" stroke-linecap="round"/><path d="M34 160 Q100 184 166 160" fill="none" stroke="${PC.crustDk}" stroke-width="2.5" opacity=".55"/><path d="M40 172 Q100 194 160 172" fill="none" stroke="#fff" stroke-width="2" opacity=".18"/>`);
  }
  if(spec.shape==='pie'){
    const pts=()=>{const a=r()*6.2832,d=Math.sqrt(r())*68;return[100+Math.cos(a)*d,100+Math.sin(a)*d]};
    let cuts='';for(let i=0;i<8;i++){const a=i*Math.PI/4+.2;cuts+=`<line x1="100" y1="100" x2="${f1(100+Math.cos(a)*82)}" y2="${f1(100+Math.sin(a)*82)}" stroke="#7a3f12" stroke-width="1.6" opacity=".35"/>`}
    return svg(`<defs><clipPath id="${id}"><circle cx="100" cy="100" r="80"/></clipPath></defs><circle cx="100" cy="103" r="95" fill="#000" opacity=".12"/><circle cx="100" cy="100" r="94" fill="${PC.crust}"/><circle cx="100" cy="100" r="94" fill="none" stroke="${PC.crustDk}" stroke-width="2" opacity=".5"/><circle cx="100" cy="100" r="83" fill="${PC.sauce}"/><g clip-path="url(#${id})"><circle cx="100" cy="100" r="80" fill="${base}"/>${drawTops(r,tops,pts,1.9)}</g>${cuts}`);
  }
  if(spec.shape==='square'){
    const pts=()=>[38+r()*124,38+r()*124];
    let stripes='';for(let i=0;i<7;i++){const[x,y]=pts();stripes+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(14+r()*8)}" ry="${f1(7+r()*4)}" fill="${PC.sauce}" opacity=".92" transform="rotate(${Math.round(r()*180)} ${f1(x)} ${f1(y)})"/>`}
    return svg(`<rect x="20" y="24" width="160" height="160" rx="12" fill="#000" opacity=".12"/><rect x="20" y="20" width="160" height="160" rx="12" fill="${PC.crust}"/><rect x="30" y="30" width="140" height="140" rx="6" fill="${base}"/><g>${drawTops(r,[],pts,1.2)}${stripes}${drawTops(r,['basil'],pts,.6)}</g>`);
  }
  if(spec.shape==='cup'){
    return svg(`<ellipse cx="100" cy="182" rx="44" ry="6" fill="#000" opacity=".12"/><path d="M58 52 L142 52 L130 178 L70 178 Z" fill="#C8261C"/><path d="M62 96 L138 96 L135 128 L65 128 Z" fill="#F6EEDF"/><text x="100" y="118" text-anchor="middle" font-family="Archivo,Arial Narrow,sans-serif" font-weight="900" font-size="16" fill="#C8261C">SLICE</text><rect x="52" y="40" width="96" height="14" rx="5" fill="#F6EEDF"/><rect x="104" y="8" width="8" height="40" rx="3" fill="#F47321" transform="rotate(10 108 28)"/>`);
  }
  if(spec.shape==='bottle'){
    return svg(`<ellipse cx="100" cy="184" rx="30" ry="5" fill="#000" opacity=".12"/><path d="M88 20h24v24c0 8 16 14 16 34v96a6 6 0 0 1-6 6H78a6 6 0 0 1-6-6V78c0-20 16-26 16-34z" fill="#BFDCE8" opacity=".9"/><rect x="72" y="100" width="56" height="40" fill="#0B5A3A"/><rect x="86" y="12" width="28" height="12" rx="3" fill="#24211E"/>`);
  }
  if(spec.shape==='combo'){
    const n=spec.n||1,s1=art({shape:'slice',base:spec.base,tops:spec.tops},seed+'a'),s2=art({shape:'slice',base:spec.base,tops:spec.tops},seed+'b'),c=art({shape:'cup'});
    const inner=x=>x.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    return svg(`${n>1?`<g transform="translate(-6 30) scale(.62) rotate(-14 100 100)">${inner(s2)}</g>`:''}<g transform="translate(${n>1?28:12} 34) scale(.66)">${inner(s1)}</g><g transform="translate(112 64) scale(.56)">${inner(c)}</g>`);
  }
  if(spec.shape==='bundle'){
    const p=art({shape:'pie',tops:spec.tops},seed),c=art({shape:'cup'});
    const inner=x=>x.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    return svg(`<g transform="translate(4 18) scale(.72)">${inner(p)}</g><g transform="translate(118 78) scale(.48)">${inner(c)}</g><g transform="translate(140 94) scale(.48)">${inner(c)}</g>`);
  }
  return svg('');
}
// Small illustrations for Our Story
const STORY_ART={
  dough:`<svg viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="74" rx="46" ry="8" fill="#000" opacity=".1"/><ellipse cx="60" cy="56" rx="40" ry="22" fill="#F3E3C3"/><ellipse cx="50" cy="48" rx="14" ry="6" fill="#fff" opacity=".5"/><circle cx="26" cy="30" r="2" fill="#F3E3C3"/><circle cx="92" cy="26" r="1.6" fill="#F3E3C3"/><circle cx="84" cy="36" r="1.2" fill="#F3E3C3"/></svg>`,
